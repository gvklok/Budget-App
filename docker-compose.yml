services:
  backend:
    build: ./backend
    # Not published to the host: nginx (frontend) reaches it over the compose
    # network, and everything user-facing goes through :3000/api.
    expose:
      - "8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
